<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,"Microsoft YaHei",sans-serif}button,input{font:inherit}#root{position:absolute;inset:0;overflow:visible}
    #orb{position:absolute;right:8px;bottom:8px;width:70px;height:70px;border:1px solid rgba(255,255,255,.75);border-radius:50%;cursor:pointer;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 5%,transparent 18%),radial-gradient(circle at 42% 38%,#86fff1 0 9%,#46d7d0 24%,#6175e8 61%,#7b4bb7 100%);box-shadow:0 0 18px rgba(92,238,223,.8),0 0 38px rgba(102,126,234,.62),inset -8px -10px 18px rgba(38,19,96,.35);animation:orbFloat 2.8s ease-in-out infinite,orbPulse 2s ease-in-out infinite}#orb:after{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.35);border-radius:50%}@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes orbPulse{0%,100%{box-shadow:0 0 18px rgba(92,238,223,.7),0 0 34px rgba(102,126,234,.55)}50%{box-shadow:0 0 26px rgba(92,238,223,.95),0 0 48px rgba(102,126,234,.8)}}
    #petStage{position:absolute;inset:0;display:none;overflow:visible}#petCanvas{position:absolute;right:0;bottom:0;width:178px;height:220px;cursor:pointer;touch-action:none}#petCanvas canvas,#chatPet canvas{display:block;width:100%;height:100%}#greeting{position:absolute;right:148px;bottom:150px;width:190px;padding:11px 13px;color:#25243a;font-size:13px;line-height:1.45;background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:greetingIn .28s ease-out}#greeting:after{content:"";position:absolute;right:-10px;bottom:24px;border-width:8px 0 8px 11px;border-style:solid;border-color:transparent transparent transparent white}#petTip{position:absolute;right:18px;bottom:4px;color:white;font-size:11px;text-shadow:0 1px 5px #000;pointer-events:none}#backToOrb{position:absolute;right:5px;top:5px;width:27px;height:27px;padding:0;border:0;border-radius:50%;color:white;background:rgba(30,30,45,.62);cursor:pointer}@keyframes greetingIn{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}
    #chatStage{position:absolute;inset:0;display:none;overflow:visible}#chatPet{position:absolute;right:294px;bottom:360px;width:125px;height:155px;pointer-events:none}#chatPanel{position:absolute;right:7px;bottom:7px;width:360px;height:500px;overflow:hidden;display:flex;flex-direction:column;border:1px solid rgba(135,125,231,.42);border-radius:20px;color:#f7f7fb;background:rgba(17,18,28,.96);box-shadow:0 22px 60px rgba(0,0,0,.42);backdrop-filter:blur(18px)}#chatHeader{height:55px;flex:0 0 55px;display:flex;align-items:center;gap:9px;padding:0 13px;background:linear-gradient(135deg,#667eea,#764ba2);cursor:move;user-select:none}.online{width:9px;height:9px;border-radius:50%;background:#55efc4;box-shadow:0 0 9px #55efc4}#chatTitle{flex:1;font-size:15px;font-weight:750}.headerBtn{width:30px;height:30px;border:0;border-radius:9px;color:white;background:rgba(255,255,255,.14);cursor:pointer}.headerBtn:hover{background:rgba(255,255,255,.25)}#messages{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin}.msg{display:flex;margin:0 0 12px}.msg.user{justify-content:flex-end}.bubble{max-width:84%;padding:9px 12px;border-radius:15px;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.assistant .bubble{color:#ececf4;background:#292b3b;border-bottom-left-radius:4px}.user .bubble{color:white;background:linear-gradient(135deg,#667eea,#7952b3);border-bottom-right-radius:4px}#thinking{display:none;padding:0 14px 9px;color:#bbb8d1;font-size:12px}#composer{flex:0 0 auto;display:flex;gap:8px;padding:11px;border-top:1px solid rgba(255,255,255,.08)}#question{flex:1;min-width:0;height:40px;padding:0 12px;border:1px solid #45475d;border-radius:12px;outline:none;color:white;background:#242633}#question:focus{border-color:#8c83ee;box-shadow:0 0 0 2px rgba(140,131,238,.17)}#send{width:58px;border:0;border-radius:12px;color:white;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);cursor:pointer}#send:disabled{opacity:.5;cursor:not-allowed}#empty{margin:75px auto 0;max-width:250px;text-align:center;color:#aaa8bb;font-size:13px;line-height:1.65}
  </style>
</head>
<body>
  <main id="root">
    <div id="orb" title="点击唤醒烷仔"></div>
    <section id="petStage">
      <div id="greeting">你好呀，我是烷仔！点击我就可以随时聊天啦～</div>
      <div id="petCanvas" title="单击烷仔开始对话"></div>
      <div id="petTip">点击聊天 · 拖动移动</div>
      <button id="backToOrb" title="收回悬浮球">×</button>
    </section>
    <section id="chatStage">
      <div id="chatPet"></div>
      <div id="chatPanel">
        <header id="chatHeader"><span class="online"></span><span id="chatTitle">与烷仔对话</span><button id="clear" class="headerBtn" title="清空对话">↻</button><button id="closeChat" class="headerBtn" title="收起聊天">−</button></header>
        <div id="messages"></div><div id="thinking">烷仔正在思考…</div>
        <form id="composer"><input id="question" maxlength="1000" autocomplete="off" placeholder="输入你的问题…"/><button id="send" type="submit">发送</button></form>
      </div>
    </section>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
    const FRAME={orb:{width:92,height:100},pet:{width:370,height:245},chat:{width:440,height:525}};
    const state={stage:sessionStorage.getItem('wanzi-stage')||'orb',args:null,modelUri:'',renderers:[],sending:false};
    const frame=window.frameElement;
    function post(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
    post('streamlit:componentReady',{apiVersion:1});
    function emit(value){post('streamlit:setComponentValue',{value,dataType:'json'})}
    function eventId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
    function frameBox(kind){const box=FRAME[kind];post('streamlit:setFrameHeight',{height:box.height});if(!frame)return;Object.assign(frame.style,{position:'fixed',width:box.width+'px',height:box.height+'px',right:frame.style.left?'auto':'20px',bottom:frame.style.top?'auto':'20px',border:'0',background:'transparent',zIndex:'2147483000',overflow:'visible'});const wrapper=frame.parentElement;if(wrapper){wrapper.style.height='0';wrapper.style.minHeight='0';wrapper.style.margin='0';wrapper.style.padding='0'}}
    function showStage(stage){state.stage=stage;sessionStorage.setItem('wanzi-stage',stage);document.getElementById('orb').style.display=stage==='orb'?'block':'none';document.getElementById('petStage').style.display=stage==='pet'?'block':'none';document.getElementById('chatStage').style.display=stage==='chat'?'block':'none';frameBox(stage);setTimeout(resizeAll,30);if(stage==='chat')setTimeout(()=>document.getElementById('question').focus(),80)}
    function createModel(host,mode){const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,1,.01,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x405071,2.7));const key=new THREE.DirectionalLight(0xffffff,3.3);key.position.set(3,5,4);scene.add(key);const rim=new THREE.DirectionalLight(0x7de3df,1.8);rim.position.set(-4,2,-3);scene.add(rim);let object=null,mixer=null,loadedUri='';const clock=new THREE.Clock(),loader=new GLTFLoader(),draco=new DRACOLoader();draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');loader.setDRACOLoader(draco);function load(uri){if(!uri||uri===loadedUri)return;loadedUri=uri;loader.load(uri,gltf=>{object=gltf.scene;scene.add(object);const box=new THREE.Box3().setFromObject(object),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());object.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1,distance=max/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));camera.position.set(0,max*.05,distance*1.12);camera.near=Math.max(.01,distance/100);camera.far=distance*100;camera.updateProjectionMatrix();if(gltf.animations?.length){mixer=new THREE.AnimationMixer(object);mixer.clipAction(gltf.animations[0]).play()}},undefined,error=>console.error('烷仔模型加载失败',error))}function resize(){const w=Math.max(host.clientWidth,1),h=Math.max(host.clientHeight,1);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(mixer)mixer.update(dt);if(object)object.rotation.y+=mode==='pet' ? .0035 : .002;renderer.render(scene,camera)}resize();animate();const item={resize,load};state.renderers.push(item);return item}
    const petModel=createModel(document.getElementById('petCanvas'),'pet'),chatModel=createModel(document.getElementById('chatPet'),'chat');
    function resizeAll(){state.renderers.forEach(item=>item.resize())}
    function renderMessages(messages){const host=document.getElementById('messages');host.textContent='';if(!messages?.length){const empty=document.createElement('div');empty.id='empty';empty.textContent='你好，我是烷仔。可以问我污水处理工艺、甲烷排放、减排建议或网站使用方法。';host.appendChild(empty)}else messages.forEach(message=>{const row=document.createElement('div');row.className='msg '+(message.role==='user'?'user':'assistant');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=message.content||'';row.appendChild(bubble);host.appendChild(row)});host.scrollTop=host.scrollHeight;state.sending=false;document.getElementById('thinking').style.display='none';document.getElementById('send').disabled=false}
    window.addEventListener('message',event=>{const data=event.data;if(!data?.isStreamlitMessage||data.type!=='streamlit:render')return;state.args=data.args||{};petModel.load(state.args.model_uri);chatModel.load(state.args.model_uri);renderMessages(state.args.messages||[]);showStage(state.stage)});
    document.getElementById('orb').addEventListener('click',()=>showStage('pet'));
    document.getElementById('backToOrb').addEventListener('click',event=>{event.stopPropagation();showStage('orb')});
    document.getElementById('closeChat').addEventListener('click',()=>showStage('pet'));
    document.getElementById('clear').addEventListener('click',()=>{if(confirm('确定清空当前对话吗？'))emit({type:'clear',id:eventId()})});
    let petDown=false,petMoved=false,sx=0,sy=0,sl=0,st=0;const pet=document.getElementById('petCanvas');
    pet.addEventListener('pointerdown',event=>{if(!frame)return;petDown=true;petMoved=false;pet.setPointerCapture(event.pointerId);const r=frame.getBoundingClientRect();sx=event.clientX;sy=event.clientY;sl=r.left;st=r.top});
    pet.addEventListener('pointermove',event=>{if(!petDown||!frame)return;const dx=event.clientX-sx,dy=event.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)petMoved=true;if(!petMoved)return;frame.style.left=Math.max(0,Math.min(parent.innerWidth-frame.offsetWidth,sl+dx))+'px';frame.style.top=Math.max(0,Math.min(parent.innerHeight-frame.offsetHeight,st+dy))+'px';frame.style.right='auto';frame.style.bottom='auto'});
    pet.addEventListener('pointerup',()=>{if(!petDown)return;petDown=false;if(!petMoved)showStage('chat')});pet.addEventListener('pointercancel',()=>petDown=false);
    document.getElementById('composer').addEventListener('submit',event=>{event.preventDefault();const input=document.getElementById('question'),text=input.value.trim();if(!text||state.sending)return;state.sending=true;input.value='';document.getElementById('thinking').style.display='block';document.getElementById('send').disabled=true;emit({type:'send',id:eventId(),text})});
    let panelDrag=false,px=0,py=0,pl=0,pt=0;const header=document.getElementById('chatHeader');
    header.addEventListener('pointerdown',event=>{if(event.target.closest('button')||!frame)return;panelDrag=true;header.setPointerCapture(event.pointerId);const r=frame.getBoundingClientRect();px=event.clientX;py=event.clientY;pl=r.left;pt=r.top});
    header.addEventListener('pointermove',event=>{if(!panelDrag||!frame)return;frame.style.left=Math.max(0,Math.min(parent.innerWidth-frame.offsetWidth,pl+event.clientX-px))+'px';frame.style.top=Math.max(0,Math.min(parent.innerHeight-frame.offsetHeight,pt+event.clientY-py))+'px';frame.style.right='auto';frame.style.bottom='auto'});
    header.addEventListener('pointerup',()=>panelDrag=false);header.addEventListener('pointercancel',()=>panelDrag=false);window.addEventListener('resize',resizeAll);showStage(state.stage);
  </script>
</body>
</html>
