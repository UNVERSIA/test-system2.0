<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script>
    // 必须在 Three.js 模块下载前监听。否则 Streamlit 首次 render 消息会被漏掉。
    window.__wanziRenderQueue = [];
    window.addEventListener('message', function (event) {
      var data = event.data;
      if (data && data.type === 'streamlit:render') {
        window.__wanziRenderQueue.push(data);
      }
    });
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: 'streamlit:componentReady',
      apiVersion: 1
    }, '*');
  </script>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,"Microsoft YaHei",sans-serif}button,input{font:inherit}#root{position:absolute;inset:0;overflow:visible}
    #orb{position:absolute;left:37px;top:37px;width:76px;height:76px;border:1px solid rgba(255,255,255,.82);border-radius:50%;cursor:pointer;background:radial-gradient(circle at 30% 25%,#fff 0 4%,rgba(255,255,255,.65) 8%,transparent 20%),radial-gradient(circle at 42% 38%,#a9fff7 0 8%,#48ddd2 24%,#6378ed 60%,#7a4ab7 100%);box-shadow:0 0 15px 5px rgba(91,247,228,.48),0 0 36px 13px rgba(102,126,234,.34),inset -9px -11px 18px rgba(38,19,96,.32);animation:orbFloat 2.8s ease-in-out infinite,orbPulse 2s ease-in-out infinite;transform-origin:center}#orb:before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(90,239,225,.22),transparent 68%);pointer-events:none}#orb:after{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.35);border-radius:50%}@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes orbPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.16)}}
    #petStage{position:absolute;inset:0;display:none;overflow:visible}#petCanvas{position:absolute;right:0;bottom:5px;width:190px;height:240px;cursor:pointer;touch-action:none;transform-origin:50% 80%;animation:petFloat 3s ease-in-out infinite,petBreath 2.4s ease-in-out infinite}#petCanvas:hover{animation-play-state:paused;filter:brightness(1.08);transform:scale(1.045)}#petCanvas canvas,#chatPet canvas{display:block;width:100%;height:100%}#greeting{position:absolute;right:160px;bottom:164px;width:200px;padding:11px 13px;color:#25243a;font-size:13px;line-height:1.45;background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:greetingIn .28s ease-out}#greeting:after{content:"";position:absolute;right:-10px;bottom:24px;border-width:8px 0 8px 11px;border-style:solid;border-color:transparent transparent transparent white}#petTip{position:absolute;right:22px;bottom:3px;color:white;font-size:11px;text-shadow:0 1px 5px #000;pointer-events:none}#backToOrb{position:absolute;right:5px;top:5px;width:27px;height:27px;padding:0;border:0;border-radius:50%;color:white;background:rgba(30,30,45,.62);cursor:pointer}@keyframes greetingIn{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}@keyframes petFloat{0%,100%{translate:0 0}50%{translate:0 -9px}}@keyframes petBreath{0%,100%{scale:1}50%{scale:1.025}}
    #chatStage{position:absolute;inset:0;display:none;overflow:visible}#chatPet{position:absolute;right:294px;bottom:360px;width:125px;height:155px;pointer-events:none}#chatPanel{position:absolute;right:7px;bottom:7px;width:360px;height:500px;overflow:hidden;display:flex;flex-direction:column;border:1px solid rgba(135,125,231,.42);border-radius:20px;color:#f7f7fb;background:rgba(17,18,28,.96);box-shadow:0 22px 60px rgba(0,0,0,.42);backdrop-filter:blur(18px)}#chatHeader{height:55px;flex:0 0 55px;display:flex;align-items:center;gap:9px;padding:0 13px;background:linear-gradient(135deg,#667eea,#764ba2);cursor:move;user-select:none}.online{width:9px;height:9px;border-radius:50%;background:#55efc4;box-shadow:0 0 9px #55efc4}#chatTitle{flex:1;font-size:15px;font-weight:750}.headerBtn{width:30px;height:30px;border:0;border-radius:9px;color:white;background:rgba(255,255,255,.14);cursor:pointer}.headerBtn:hover{background:rgba(255,255,255,.25)}#messages{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin}.msg{display:flex;margin:0 0 12px}.msg.user{justify-content:flex-end}.bubble{max-width:84%;padding:9px 12px;border-radius:15px;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.assistant .bubble{color:#ececf4;background:#292b3b;border-bottom-left-radius:4px}.user .bubble{color:white;background:linear-gradient(135deg,#667eea,#7952b3);border-bottom-right-radius:4px}#thinking{display:none;padding:0 14px 9px;color:#bbb8d1;font-size:12px}#composer{flex:0 0 auto;display:flex;gap:8px;padding:11px;border-top:1px solid rgba(255,255,255,.08)}#question{flex:1;min-width:0;height:40px;padding:0 12px;border:1px solid #45475d;border-radius:12px;outline:none;color:white;background:#242633}#question:focus{border-color:#8c83ee;box-shadow:0 0 0 2px rgba(140,131,238,.17)}#send{width:58px;border:0;border-radius:12px;color:white;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);cursor:pointer}#send:disabled{opacity:.5;cursor:not-allowed}#empty{margin:75px auto 0;max-width:250px;text-align:center;color:#aaa8bb;font-size:13px;line-height:1.65}
  </style>
</head>
<body>
  <main id="root">
    <div id="orb" title="点击唤醒烷仔"></div>
    <section id="petStage">
      <div id="greeting">你好呀，我是烷仔！点击我就可以随时聊天啦～</div>
      <div id="petCanvas" title="单击烷仔开始对话"></div>
      <div id="petTip">点击聊天 · 拖动移动</div>
      <button id="backToOrb" title="收回悬浮球">×</button>
    </section>
    <section id="chatStage">
      <div id="chatPet"></div>
      <div id="chatPanel">
        <header id="chatHeader"><span class="online"></span><span id="chatTitle">与烷仔对话</span><button id="clear" class="headerBtn" title="清空对话">↻</button><button id="closeChat" class="headerBtn" title="收起聊天">−</button></header>
        <div id="messages"></div><div id="thinking">烷仔正在思考…</div>
        <form id="composer"><input id="question" maxlength="1000" autocomplete="off" placeholder="输入你的问题…"/><button id="send" type="submit">发送</button></form>
      </div>
    </section>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
    const FRAME={orb:{width:150,height:150},pet:{width:400,height:270},chat:{width:440,height:525}};
    const savedPosition=JSON.parse(localStorage.getItem('wanzi-position')||'null');
    const state={stage:sessionStorage.getItem('wanzi-stage-v4')||'orb',args:null,renderers:[],sending:false,center:savedPosition};
    const frame=window.frameElement;
    function post(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
    function emit(value){post('streamlit:setComponentValue',{value,dataType:'json'})}
    function eventId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
    function frameBox(kind){
      const box=FRAME[kind];post('streamlit:setFrameHeight',{height:box.height});if(!frame)return;
      if(!state.center){state.center={x:window.parent.innerWidth-22-box.width/2,y:window.parent.innerHeight*.58}}
      const left=Math.max(0,Math.min(window.parent.innerWidth-box.width,state.center.x-box.width/2));
      const top=Math.max(0,Math.min(window.parent.innerHeight-box.height,state.center.y-box.height/2));
      Object.assign(frame.style,{position:'fixed',width:box.width+'px',height:box.height+'px',left:left+'px',top:top+'px',right:'auto',bottom:'auto',transform:'none',border:'0',outline:'0',boxShadow:'none',background:'transparent',backgroundColor:'transparent',zIndex:'2147483000',overflow:'visible'});
      frame.setAttribute('allowtransparency','true');
      const wrapper=frame.parentElement;
      if(wrapper){wrapper.style.height='0';wrapper.style.minHeight='0';wrapper.style.margin='0';wrapper.style.padding='0';wrapper.style.background='transparent';wrapper.style.backgroundColor='transparent';wrapper.style.border='0';wrapper.style.outline='0';wrapper.style.boxShadow='none'}
    }
    function rememberPosition(){if(!frame)return;const r=frame.getBoundingClientRect();state.center={x:r.left+r.width/2,y:r.top+r.height/2};localStorage.setItem('wanzi-position',JSON.stringify(state.center))}
    function showStage(stage){state.stage=stage;sessionStorage.setItem('wanzi-stage-v4',stage);document.getElementById('orb').style.display=stage==='orb'?'block':'none';document.getElementById('petStage').style.display=stage==='pet'?'block':'none';document.getElementById('chatStage').style.display=stage==='chat'?'block':'none';frameBox(stage);setTimeout(resizeAll,30);if(stage==='chat')setTimeout(()=>document.getElementById('question').focus(),80)}
    function createModel(host,mode){
      const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,1,.01,100);
      const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
      renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
      renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.setClearColor(0x000000,0);renderer.setClearAlpha(0);renderer.domElement.style.background='transparent';host.appendChild(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0xffffff,0x405071,2.7));
      const key=new THREE.DirectionalLight(0xffffff,3.3);key.position.set(3,5,4);scene.add(key);
      const rim=new THREE.DirectionalLight(0x7de3df,1.8);rim.position.set(-4,2,-3);scene.add(rim);
      let object=null,mixer=null,idleAction=null,helloAction=null,loadedUri='',lookX=0,lookY=0,hovering=false,helloUntil=0,baseY=0;
      const clock=new THREE.Clock(),loader=new GLTFLoader(),draco=new DRACOLoader();
      draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');loader.setDRACOLoader(draco);
      function load(uri){
        if(!uri||uri===loadedUri)return;loadedUri=uri;
        loader.load(uri,gltf=>{
          object=gltf.scene;scene.add(object);
          const box=new THREE.Box3().setFromObject(object),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
          object.position.sub(center);baseY=object.position.y;const max=Math.max(size.x,size.y,size.z)||1;
          const distance=max/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
          camera.position.set(0,max*.05,distance*1.12);camera.near=Math.max(.01,distance/100);camera.far=distance*100;camera.updateProjectionMatrix();
          if(gltf.animations?.length){
            mixer=new THREE.AnimationMixer(object);
            const helloClip=gltf.animations.find(c=>/hello|wave|waving|挥手/i.test(c.name));
            const idleClip=gltf.animations.find(c=>/idle|stand|breath|待机/i.test(c.name));
            if(idleClip){idleAction=mixer.clipAction(idleClip);idleAction.play()}
            if(helloClip){helloAction=mixer.clipAction(helloClip);helloAction.setLoop(THREE.LoopOnce,1);helloAction.clampWhenFinished=true}
          }
        },undefined,error=>{console.error('烷仔模型加载失败',error);document.getElementById('greeting').textContent='3D烷仔加载失败，请刷新页面或检查模型文件。'});
      }
      function resize(){const w=Math.max(host.clientWidth,1),h=Math.max(host.clientHeight,1);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
      function look(nx,ny,active=true){lookY=THREE.MathUtils.clamp(nx,-1,1)*.42;lookX=THREE.MathUtils.clamp(ny,-1,1)*.12;hovering=active}
      function playHello(){
        let duration=1050;helloUntil=performance.now()+duration;
        if(helloAction){if(idleAction)idleAction.fadeOut(.15);helloAction.reset().fadeIn(.12).play();duration=Math.min(2200,Math.max(800,helloAction.getClip().duration*1000));setTimeout(()=>{helloAction.fadeOut(.15);if(idleAction)idleAction.reset().fadeIn(.15).play()},duration)}
        return duration;
      }
      function animate(){
        requestAnimationFrame(animate);const dt=clock.getDelta(),now=performance.now();if(mixer)mixer.update(dt);
        if(object){
          if(now<helloUntil&&!helloAction){const p=1-(helloUntil-now)/1050;object.rotation.y=Math.sin(p*Math.PI*2)*.18;object.position.y=baseY+Math.sin(p*Math.PI)*.06}
          else{object.position.y+=(baseY-object.position.y)*.08;const targetY=hovering?lookY:Math.sin(now*.00065)*.045;const targetX=hovering?lookX:0;object.rotation.y+=(targetY-object.rotation.y)*.09;object.rotation.x+=(targetX-object.rotation.x)*.09}
        }
        renderer.render(scene,camera)
      }
      resize();animate();const item={resize,load,look,playHello};state.renderers.push(item);return item
    }
    const petModel=createModel(document.getElementById('petCanvas'),'pet'),chatModel=createModel(document.getElementById('chatPet'),'chat');
    function resizeAll(){state.renderers.forEach(item=>item.resize())}
    function renderMessages(messages){const host=document.getElementById('messages');host.textContent='';if(!messages?.length){const empty=document.createElement('div');empty.id='empty';empty.textContent='你好，我是烷仔。可以问我污水处理工艺、甲烷排放、减排建议或网站使用方法。';host.appendChild(empty)}else messages.forEach(message=>{const row=document.createElement('div');row.className='msg '+(message.role==='user'?'user':'assistant');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=message.content||'';row.appendChild(bubble);host.appendChild(row)});host.scrollTop=host.scrollHeight;state.sending=false;document.getElementById('thinking').style.display='none';document.getElementById('send').disabled=false}
    function handleStreamlitRender(data){
      if(!data||data.type!=='streamlit:render')return;
      state.args=data.args||{};
      const modelUrl=new URL('./'+(state.args.model_file||'wanzi_web.glb'),window.location.href).href;
      petModel.load(modelUrl);chatModel.load(modelUrl);renderMessages(state.args.messages||[]);showStage(state.stage);
    }
    window.addEventListener('message',event=>handleStreamlitRender(event.data));
    (window.__wanziRenderQueue||[]).forEach(handleStreamlitRender);
    window.__wanziRenderQueue=[];
    document.getElementById('backToOrb').addEventListener('click',event=>{event.stopPropagation();showStage('orb')});
    document.getElementById('closeChat').addEventListener('click',()=>showStage('pet'));
    document.getElementById('clear').addEventListener('click',()=>{if(confirm('确定清空当前对话吗？'))emit({type:'clear',id:eventId()})});
    function makeDraggable(handle,onTap,ignoreSelector=''){
      let down=false,moved=false,sx=0,sy=0,sl=0,st=0,pointerId=null;
      handle.style.touchAction='none';
      handle.addEventListener('pointerdown',event=>{
        if(!frame||(ignoreSelector&&event.target.closest(ignoreSelector)))return;
        down=true;moved=false;pointerId=event.pointerId;handle.setPointerCapture(pointerId);
        const r=frame.getBoundingClientRect();sx=event.screenX;sy=event.screenY;sl=r.left;st=r.top;event.preventDefault();
      });
      handle.addEventListener('pointermove',event=>{
        if(!down||!frame)return;const dx=event.screenX-sx,dy=event.screenY-sy;
        if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(!moved)return;
        frame.style.left=Math.max(0,Math.min(window.parent.innerWidth-frame.offsetWidth,sl+dx))+'px';
        frame.style.top=Math.max(0,Math.min(window.parent.innerHeight-frame.offsetHeight,st+dy))+'px';
        frame.style.right='auto';frame.style.bottom='auto';frame.style.transform='none';
      });
      const finish=event=>{
        if(!down)return;down=false;try{if(pointerId!==null)handle.releasePointerCapture(pointerId)}catch(_error){}
        if(moved)rememberPosition();else if(onTap)onTap(event);pointerId=null;
      };
      handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',()=>{down=false;pointerId=null});
      handle.addEventListener('lostpointercapture',()=>{if(down){down=false;rememberPosition()}});
    }
    const orb=document.getElementById('orb'),pet=document.getElementById('petCanvas'),header=document.getElementById('chatHeader');
    makeDraggable(orb,()=>showStage('pet'));
    makeDraggable(pet,()=>{
      document.getElementById('greeting').textContent='你好呀，我是烷仔！很高兴见到你～';
      const duration=petModel.playHello();setTimeout(()=>showStage('chat'),duration);
    });
    makeDraggable(header,null,'button');
    pet.addEventListener('pointerenter',()=>petModel.look(0,0,true));
    pet.addEventListener('pointermove',event=>{const r=pet.getBoundingClientRect();petModel.look(((event.clientX-r.left)/r.width-.5)*2,((event.clientY-r.top)/r.height-.5)*2,true)});
    pet.addEventListener('pointerleave',()=>petModel.look(0,0,false));
    document.getElementById('composer').addEventListener('submit',event=>{event.preventDefault();const input=document.getElementById('question'),text=input.value.trim();if(!text||state.sending)return;state.sending=true;input.value='';document.getElementById('thinking').style.display='block';document.getElementById('send').disabled=true;emit({type:'send',id:eventId(),text})});
    window.addEventListener('resize',()=>{resizeAll();frameBox(state.stage)});showStage(state.stage);
  </script>
</body>
</html>
